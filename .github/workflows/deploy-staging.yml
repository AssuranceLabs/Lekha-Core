name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest

    environment: staging

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      IMAGE_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Normalize image owner
        run: |
          echo "IMAGE_OWNER=${IMAGE_OWNER,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/lekhacore-frontend:staging-${{ env.IMAGE_TAG }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/lekhacore-api:staging-${{ env.IMAGE_TAG }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare staging directory
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$USER@$HOST" \
            "mkdir -p '$DEPLOY_PATH/infrastructure/docker/compose' '$DEPLOY_PATH/infrastructure/nginx'"

      - name: Copy deployment configuration
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          scp infrastructure/docker/compose/docker-compose.staging.yml \
            "$USER@$HOST:$DEPLOY_PATH/infrastructure/docker/compose/"
          scp infrastructure/nginx/nginx.conf \
            "$USER@$HOST:$DEPLOY_PATH/infrastructure/nginx/nginx.conf"

      - name: Deploy staging
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$USER@$HOST" \
            "cd '$DEPLOY_PATH' &&
             IMAGE_OWNER='${IMAGE_OWNER}' IMAGE_TAG='staging-${IMAGE_TAG}' \
             docker compose --env-file .env.staging \
               -f infrastructure/docker/compose/docker-compose.staging.yml pull &&
             IMAGE_OWNER='${IMAGE_OWNER}' IMAGE_TAG='staging-${IMAGE_TAG}' \
             docker compose --env-file .env.staging \
               -f infrastructure/docker/compose/docker-compose.staging.yml up -d --remove-orphans"